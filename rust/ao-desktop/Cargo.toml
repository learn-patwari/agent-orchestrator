[package]
name = "ao-desktop"
version.workspace = true
edition.workspace = true
description = "Agent Orchestrator desktop shell (Tauri): runs the Rust backend in process and shows the UI in a window"

[lib]
name = "ao_desktop"
path = "src/lib.rs"

[[bin]]
name = "agent-orchestrator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ao-server = { path = "../ao-server" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
tempfile = "3"
